packages:
  - .
  - plugins/*
  - upstream/dsh-TUI
  - upstream/dsh-TUI/dsh-auth
  - upstream/dsh-TUI/vendor/dsh-std/packages/command
  - upstream/dsh-TUI/vendor/dsh-std/packages/connection
  - upstream/dsh-TUI/vendor/dsh-std/packages/core
  - upstream/dsh-TUI/vendor/dsh-std/packages/manifest
  - upstream/dsh-TUI/vendor/dsh-std/packages/messages
  - upstream/dsh-TUI/vendor/dsh-std/packages/presentation
  - upstream/dsh-TUI/vendor/dsh-std/packages/storage
  - web

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - dsh-working-activity@0.2.2

# The pinned TUI uses React 19. Its renderer dependencies and the rc.7 DSH
# client packages are exercised together by the TUI adapter and surface smoke,
# but their published React peer ranges have not caught up yet.
peerDependencyRules:
  allowedVersions:
    react: ^19.0.0

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  'electron': true
  'electron-winstaller': true
  'esbuild': true
  'koffi': false
  'node-pty': true
  'protobufjs': false

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - node-pty

# The pinned DSH release line rides the npm `next` dist-tag, and pnpm's
# prerelease resolution of the pinned dsh-TUI's wide union ranges
# (`^0.1.0-rc.6 || ^0.1.1-rc.1 || ^0.1.2-alpha.2`) otherwise fails or drifts
# off the pinned line. Pin the @deepseek-ai/dsh-* tree to the pinned release,
# mirroring the override block the upstream dsh-TUI workspace itself carries.
overrides:
  '@deepseek-ai/dsh-session-persistence-sqlite': 0.1.2-alpha.2
  '@deepseek-ai/dsh-agent-instructions': 0.1.2-alpha.3
  '@deepseek-ai/dsh-agent-presets': 0.1.2-alpha.3
  '@deepseek-ai/dsh-agent': 0.1.2-alpha.3
  '@deepseek-ai/dsh-atomic-write': 0.1.2-alpha.3
  '@deepseek-ai/dsh-attachment': 0.1.2-alpha.3
  '@deepseek-ai/dsh-brand': 0.1.2-alpha.3
  '@deepseek-ai/dsh-code-runtime-worker-thread': 0.1.2-alpha.3
  '@deepseek-ai/dsh-code-runtime': 0.1.2-alpha.3
  '@deepseek-ai/dsh-commands': 0.1.2-alpha.3
  '@deepseek-ai/dsh-cordis-host-runner': 0.1.2-alpha.3
  '@deepseek-ai/dsh-fs': 0.1.2-alpha.3
  '@deepseek-ai/dsh-home-paths': 0.1.2-alpha.3
  '@deepseek-ai/dsh-invariants': 0.1.2-alpha.3
  '@deepseek-ai/dsh-llm-pi-ai': 0.1.2-alpha.3
  '@deepseek-ai/dsh-llm': 0.1.2-alpha.3
  '@deepseek-ai/dsh-persona': 0.1.2-alpha.3
  '@deepseek-ai/dsh-sandbox-policy': 0.1.2-alpha.3
  '@deepseek-ai/dsh-sandbox': 0.1.2-alpha.3
  '@deepseek-ai/dsh-scope': 0.1.2-alpha.3
  '@deepseek-ai/dsh-session-persistence-jsonl': 0.1.2-alpha.3
  '@deepseek-ai/dsh-session-persistence': 0.1.2-alpha.3
  '@deepseek-ai/dsh-session': 0.1.2-alpha.3
  '@deepseek-ai/dsh-settings': 0.1.2-alpha.3
  '@deepseek-ai/dsh-skill': 0.1.2-alpha.3
  '@deepseek-ai/dsh-storage-domain': 0.1.2-alpha.3
  '@deepseek-ai/dsh-storage-json': 0.1.2-alpha.3
  '@deepseek-ai/dsh-storage': 0.1.2-alpha.3
  '@deepseek-ai/dsh-subprocess': 0.1.2-alpha.3
  '@deepseek-ai/dsh-system-prompt': 0.1.2-alpha.3
  '@deepseek-ai/dsh-terminal-bash': 0.1.2-alpha.3
  '@deepseek-ai/dsh-terminal': 0.1.2-alpha.3
  '@deepseek-ai/dsh-timeout': 0.1.2-alpha.3
  '@deepseek-ai/dsh-tool-ask-user': 0.1.2-alpha.3
  '@deepseek-ai/dsh-tool-bash-persistent': 0.1.2-alpha.3
  '@deepseek-ai/dsh-tool-cordis': 0.1.2-alpha.3
  '@deepseek-ai/dsh-tool-subagent': 0.1.2-alpha.3
  '@deepseek-ai/dsh-tools': 0.1.2-alpha.3
  '@deepseek-ai/dsh-typert-protocol': 0.1.2-alpha.3
