# Oh-DSH-Desktop is a bundle layer over dsh-base + dsh-web-app. The Electron
# distribution keeps DSH's browser UI and mounts each desktop behavior as an
# independently registered Host/Client plugin.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    # The Electron surface carves its own window; never hand the URL to the
    # OS default browser (dsh-web-app would otherwise auto-open since rc.8).
    openBrowser: false
    printUrl: true
    surfaceContext: false
    trustedHosts: []

- id: ui-layout
  disabled: true

# The distribution's advisory DeepSeek model catalog: the pinned runtime's
# three shipped models plus DeepSeek-V4.1-Flash, served through 2026-09-10.
# A patch row replaces the dsh-base row's whole config, so this restates
# every catalog entry; the user's `llm-deepseek:` settings section still
# layers over this entry without a restart. The catalog is display-only:
# requests keep accepting any model id the endpoint serves.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or parallel tasks.
        contextWindow: 1000000
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities: [text, image]
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
      - id: deepseek-v4.1-flash-expires-on-0910
        name: DeepSeek-V4.1-Flash-Expires-On-0910
        contextWindow: 1000000
        inputModalities: [text, image]
        imagePixelBudget: 640000
        imageMaxBytes: 1048576

- insert:
    - id: oh-desktop-frame
      name: '@oh-dsh/desktop-frame'

    - id: oh-update-button
      name: '@oh-dsh/update-button'

    - id: oh-desktop
      name: '@oh-dsh/desktop'

    - id: oh-liangshen
      name: '@oh-dsh/liangshen'

    - id: oh-better-sidebar-runtime
      name: '@oh-dsh/better-sidebar-runtime'

    - id: oh-skins
      name: '@oh-dsh/skins'

    - id: oh-sidebar
      name: '@oh-dsh/sidebar'

    - id: oh-panel-controls
      name: '@oh-dsh/panel-controls'

    - id: oh-pinned-summary
      name: '@oh-dsh/pinned-summary'

    - id: oh-plugin-marketplace
      name: '@oh-dsh/plugin-marketplace'

    - id: oh-about
      name: '@oh-dsh/about'

    - id: oh-save-as-image
      name: '@oh-dsh/save-as-image'

    # Built-in context insight panel (upstream dsh-context, pinned under
    # upstream/dsh-context). Its host half is a plain Cordis plugin; the
    # dsh.client declaration in its staged manifest loads the browser half.
    - id: dsh-context
      name: 'dsh-context'

    # Subscription OAuth sign-in (upstream dsh-auth, pinned inside
    # upstream/dsh-TUI): llm provider routes for ChatGPT/Codex, Claude
    # Pro/Max and SuperGrok plus the /auth command; login interaction runs
    # over the user-questions seam. TUI loads it via the renderer instead.
    - id: dsh-auth
      name: '@deepseek-harness-tui/dsh-auth'
      inject: [llm, commands]
