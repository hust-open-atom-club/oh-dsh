name: Nix hash refresh (temporary)

# One-off helper for the 0.1.2-alpha.3 upgrade PR: refreshes the fixed-output
# hashes the nix assembly needs after the source pins moved. Patches the four
# GitHub source hashes first, then iterates real builds, capturing each
# fixed-output mismatch's got-hash and patching the matching nix file until
# the build succeeds. Delete this workflow once the values land in nix/*.nix.

on:
  workflow_dispatch:
  push:
    branches: ['runtime/dsh-0.1.2-alpha.3']

env:
  SIDEBAR: sha256-dm2wsVyjnXX6D4uvXMd971gM3o7Oh6gT7tK5do074fw=
  TUI: sha256-cS+CHJoko+KLCmMZk8WUt2vxFkd2Pg6sSieTfvVStMU=
  AUTH: sha256-H2h/yyg56pDMMnx3YvC5xxXdX4T80V2tz8A32vua2LU=
  SPEC: sha256-hhp/UUMo2engw0SyrB0Gq6Xc6BUYgvEmYh0F4OBdZEw=

jobs:
  hashes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Patch GitHub source hashes
        run: |
          sed -i "s|hash = \"sha256-bfpop+QKF8fRAl/vWjcTJgTkBA2bvHK+/KlBkR0NLa4=\";|hash = \"$SIDEBAR\";|" nix/oh-dsh.nix
          sed -i "s|hash = \"sha256-AU3SxnjucUA8yvQia+cw/q3cqItRCFb/njaiRoiOS9c=\";|hash = \"$TUI\";|" nix/oh-dsh.nix
          sed -i "s|hash = \"sha256-ip/jdsm/YiPvVdZ0o2m/thImd+4ZmRjzQKzXvJ9dAK8=\";|hash = \"$AUTH\";|" nix/oh-dsh.nix
          sed -i "s|hash = \"sha256-7PK0j8gl3+1esTzjlrKOZkEei6OL13H/4JiIOf5LOR8=\";|hash = \"$SPEC\";|" nix/oh-dsh.nix
          grep -n "hash = \"sha256-" nix/oh-dsh.nix
      - name: Iterate builds until fixed-output hashes converge
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== attempt $attempt ==="
            if nix build --no-link .#oh-dsh-tui-pinned 2>&1 | tee /tmp/build.log; then
              echo "=== BUILD OK on attempt $attempt ==="
              break
            fi
            drv=$(grep -oE "/nix/store/[a-z0-9]+-[a-zA-Z0-9._+-]+\.drv" /tmp/build.log | head -1)
            got=$(grep -oE "got: +sha256-[A-Za-z0-9+/=]+" /tmp/build.log | head -1 | grep -oE "sha256-[^ ]+")
            echo "drv=$drv got=$got"
            [ -n "$got" ] || { echo "no got-hash surfaced"; cat /tmp/build.log; exit 1; }
            case "$drv" in
              *dsh-runtime-pinned*) target=nix/dsh-runtime-pinned.nix ;;
              *oh-dsh-*) target=nix/oh-dsh.nix ;;
              *) echo "unexpected derivation: $drv"; exit 1 ;;
            esac
            echo "patching $target with $got"
            sed -i -E "0,/hash = \"sha256-[A-Za-z0-9+/=]+\";/s//hash = \"$got\";/" "$target"
            grep -n "hash = \"sha256-" "$target" | head -3
          done
          git diff --stat
          git diff nix/
