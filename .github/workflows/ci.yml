name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            node_architecture: arm64
          - name: macOS x64
            os: macos-15-intel
            node_architecture: x64
          - name: Linux x64
            os: ubuntu-24.04
            node_architecture: x64
          - name: Windows x64
            os: windows-2025
            node_architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail
          attempts=5
          backoff=5
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            echo "::group::Submodule checkout attempt ${attempt}/${attempts}"
            if git submodule sync --recursive \
              && git -c protocol.version=2 submodule update --init --force --recursive; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Submodule checkout attempt ${attempt}/${attempts} failed"
            git submodule deinit --force --all >/dev/null 2>&1 || true
            git clean -ffd -- upstream >/dev/null 2>&1 || true
            if (( attempt < attempts )); then
              sleep "$((attempt * backoff))"
            fi
          done
          echo "::error::Submodule checkout failed after ${attempts} attempts"
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_architecture }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        if: matrix.os != 'ubuntu-24.04'
        run: pnpm test

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm run build

  runtime:
    name: Runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail
          attempts=5
          backoff=5
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            echo "::group::Submodule checkout attempt ${attempt}/${attempts}"
            if git submodule sync --recursive \
              && git -c protocol.version=2 submodule update --init --force --recursive; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Submodule checkout attempt ${attempt}/${attempts} failed"
            git submodule deinit --force --all >/dev/null 2>&1 || true
            git clean -ffd -- upstream >/dev/null 2>&1 || true
            if (( attempt < attempts )); then
              sleep "$((attempt * backoff))"
            fi
          done
          echo "::error::Submodule checkout failed after ${attempts} attempts"
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and stage the pinned runtime
        run: pnpm run build && pnpm run build:dsh && pnpm run stage:dsh

      - name: Smoke the web profile
        run: xvfb-run -a pnpm run smoke:web

      - name: Smoke the desktop profile
        run: xvfb-run -a pnpm run smoke:runtime

  agent-notes:
    name: Agent Notes gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Agent Notes gates
        run: pnpm run verify:agent-notes

      - name: Run bilingual pairing gate
        run: pnpm run verify-translation-pairing
