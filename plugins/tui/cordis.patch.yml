# Oh-DSH's downstream layer for the pinned dsh-TUI bundle. The upstream
# renderer keeps its implementation, while these rows establish the shared
# surface contract, install @oh-dsh/skins, and then mount the renderer.

- id: cc-tui
  disabled: true

- id: dsh-tui
  disabled: true

# The distribution's advisory DeepSeek model catalog: the pinned runtime's
# three shipped models plus DeepSeek-V4.1-Flash, served through 2026-09-10.
# A patch row replaces the dsh-base row's whole config, so this restates
# every catalog entry; the user's `llm-deepseek:` settings section still
# layers over this entry without a restart. The catalog is display-only:
# requests keep accepting any model id the endpoint serves.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or parallel tasks.
        contextWindow: 1000000
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities: [text, image]
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
      - id: deepseek-v4.1-flash-expires-on-0910
        name: DeepSeek-V4.1-Flash-Expires-On-0910
        contextWindow: 1000000
        inputModalities: [text, image]
        imagePixelBudget: 640000
        imageMaxBytes: 1048576

- insert:
  - id: oh-tui
    name: '@oh-dsh/tui'

  - id: oh-plugin-marketplace
    name: '@oh-dsh/plugin-marketplace'

  - id: oh-skins
    name: '@oh-dsh/skins'

  - id: oh-tui-marketplace
    name: '@oh-dsh/tui-marketplace'

  - id: oh-tui-renderer
    name: '@deepseek-harness-tui/dsh-tui'
    inject: [workspaceRegistry, agents, tuiWorkspaces, tuiScenes, tuiDialogs, tuiStatus, tuiShortcuts, tuiRenderers]
    config:
      sessionId: !!js process.env.OH_DSH_TUI_SESSION_ID ?? undefined
      provider: !!js process.env.OH_DSH_TUI_PROVIDER ?? 'deepseek-official'
      model: !!js process.env.OH_DSH_TUI_MODEL ?? undefined
      cwd: !!js process.env.OH_DSH_TUI_CWD ?? process.cwd()
      effort: !!js process.env.OH_DSH_TUI_EFFORT ?? 'max'
      activity: !!js "process.env.OH_DSH_TUI_ACTIVITY !== '0'"
      activityFrames: !!js process.env.OH_DSH_TUI_ACTIVITY_FRAMES ?? undefined
      contextBar: !!js "process.env.OH_DSH_TUI_CONTEXT_BAR !== '0'"
      fullscreen: !!js "process.env.OH_DSH_TUI_FULLSCREEN === '1'"
      lang: !!js process.env.OH_DSH_TUI_LANG ?? undefined
      preset: !!js process.env.OH_DSH_TUI_PRESET ?? undefined
